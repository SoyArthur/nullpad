<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NULLPAD</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky0: #0a1628;
    --sky1: #0d2a52;
    --sky2: #1a4a8a;
    --sky3: #2d7dd2;
    --sky4: #5bb3f0;
    --sky5: #a8daf5;
    --white: #ffffff;
    --glass: rgba(255,255,255,0.14);
    --glass-border: rgba(255,255,255,0.28);
    --glass-shine: rgba(255,255,255,0.55);
    --shadow: rgba(0,60,140,0.5);
    --text: #e8f4ff;
    --muted: rgba(200,230,255,0.6);
    --font: 'SF Pro Rounded', 'SF Pro Display', -apple-system, 'Segoe UI Rounded', system-ui, sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    background: linear-gradient(175deg, var(--sky0) 0%, var(--sky1) 30%, var(--sky2) 60%, var(--sky3) 85%, var(--sky4) 100%);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    position: relative;
  }

  /* ── Ambient orbs (Frutiger Aero background blobs) ─────────────────────── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    opacity: 0.35;
    animation: orb-drift linear infinite;
  }
  .orb-1 { width: 280px; height: 280px; background: radial-gradient(circle, #5bb3f0, #1a4a8a); top: -60px; left: -60px; animation-duration: 18s; }
  .orb-2 { width: 200px; height: 200px; background: radial-gradient(circle, #a8daf5, #2d7dd2); bottom: -40px; right: -40px; animation-duration: 24s; animation-delay: -8s; }
  .orb-3 { width: 160px; height: 160px; background: radial-gradient(circle, #c8eeff, #5bb3f0); top: 40%; left: 60%; animation-duration: 20s; animation-delay: -4s; }

  @keyframes orb-drift {
    0%   { transform: translate(0px, 0px) scale(1); }
    33%  { transform: translate(20px, -15px) scale(1.05); }
    66%  { transform: translate(-10px, 20px) scale(0.97); }
    100% { transform: translate(0px, 0px) scale(1); }
  }

  /* ── Floating bubbles (Frutiger Aero signature) ─────────────────────────── */
  .bubbles {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), rgba(150,210,255,0.08));
    border: 1px solid rgba(255,255,255,0.22);
    animation: bubble-rise linear infinite;
  }
  @keyframes bubble-rise {
    0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
  }

  /* ── XMB-style layout ───────────────────────────────────────────────────── */
  .xmb-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4dvh, 36px);
    width: 100%;
    max-width: 500px;
    padding: 0 clamp(12px, 4vw, 28px);
    position: relative;
    z-index: 10;
  }

  /* ── Logo ────────────────────────────────────────────────────────────────── */
  .np-logo {
    text-align: center;
    user-select: none;
  }
  .np-logo-text {
    font-size: clamp(26px, 8vw, 42px);
    font-weight: 900;
    letter-spacing: .12em;
    color: var(--white);
    text-shadow:
      0 0 20px rgba(91,179,240,0.9),
      0 0 60px rgba(45,125,210,0.5),
      0 2px 4px rgba(0,0,0,0.4);
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  .np-logo-sub {
    font-size: clamp(9px, 2.5vw, 12px);
    letter-spacing: .22em;
    color: rgba(168,218,245,0.75);
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* ── XMB icon row ────────────────────────────────────────────────────────── */
  .xmb-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3.5vw, 22px);
    width: 100%;
  }

  .xmb-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }

  .xmb-item:active {
    transform: scale(0.90);
  }

  /* The glass bubble icon */
  .xmb-icon {
    width: clamp(58px, 16vw, 82px);
    height: clamp(58px, 16vw, 82px);
    border-radius: 50%;
    background: var(--glass);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 8px 24px var(--shadow),
      inset 0 1px 0 var(--glass-shine),
      inset 0 -2px 8px rgba(0,0,0,0.2);
    transition: box-shadow 0.18s, border-color 0.18s;
  }

  /* Top specular shine — Frutiger Aero signature */
  .xmb-icon::before {
    content: '';
    position: absolute;
    top: 4px; left: 12%; right: 12%;
    height: 36%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.55), rgba(255,255,255,0));
    border-radius: 50%;
    pointer-events: none;
  }

  .xmb-item:active .xmb-icon {
    box-shadow:
      0 4px 12px var(--shadow),
      inset 0 1px 0 var(--glass-shine),
      inset 0 0 20px rgba(91,179,240,0.3);
    border-color: rgba(255,255,255,0.5);
  }

  /* SVG sprite inside each icon */
  .xmb-sprite {
    width: 52%;
    height: 52%;
    display: block;
    filter: drop-shadow(0 2px 4px rgba(0,0,50,0.4));
  }

  .xmb-label {
    font-size: clamp(8px, 2.2vw, 11px);
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--muted);
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── Notification row (PSVita-style bubble count indicator) ─────────────── */
  .xmb-notif {
    position: absolute;
    top: -4px; right: -4px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #e53935;
    border: 1.5px solid rgba(255,255,255,0.6);
    font-size: 8px; font-weight: 900;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  /* ── Status strip ───────────────────────────────────────────────────────── */
  .np-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(9px, 2.3vw, 11px);
    color: rgba(168,218,245,0.65);
    letter-spacing: .05em;
  }
  .np-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── Music toggle ───────────────────────────────────────────────────────── */
  .music-btn {
    position: fixed;
    bottom: clamp(10px, 3dvh, 20px);
    right: clamp(10px, 3vw, 20px);
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    color: rgba(200,235,255,0.8);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 1px 0 var(--glass-shine), 0 4px 12px var(--shadow);
    z-index: 20;
    transition: opacity 0.2s;
  }
  .music-btn.muted { opacity: 0.45; }

  /* ── Clock (PSVita corner detail) ───────────────────────────────────────── */
  .np-clock {
    position: fixed;
    top: clamp(8px, 2dvh, 14px);
    right: clamp(10px, 3vw, 18px);
    font-size: clamp(9px, 2.2vw, 11px);
    font-family: 'SF Mono', 'Consolas', monospace;
    font-weight: 700;
    letter-spacing: .08em;
    color: rgba(200,230,255,0.55);
    z-index: 20;
  }
</style>
</head>

<script>
/* ── Clock ─────────────────────────────────────────────────────────────── */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 10000);

/* ── Bubbles ───────────────────────────────────────────────────────────── */
(function spawnBubbles() {
  const container = document.getElementById('bubbles');
  const SIZES = [10,14,18,22,30,40];
  function spawn() {
    const el = document.createElement('div');
    el.className = 'bubble';
    const s = SIZES[Math.floor(Math.random()*SIZES.length)];
    const x = Math.random() * 95;
    const dur = 9 + Math.random() * 14;
    const delay = Math.random() * 4;
    el.style.cssText = `width:${s}px;height:${s}px;left:${x}%;animation-duration:${dur}s;animation-delay:${delay}s;`;
    container.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay + 1) * 1000);
  }
  // Initial batch
  for (let i = 0; i < 6; i++) {
    setTimeout(spawn, i * 900);
  }
  // Continuous spawn
  setInterval(spawn, 2200);
})();

/* ── Procedural Frutiger Aero ambient music (Web Audio API) ────────────── */
(function audioEngine() {
  let ctx = null;
  let running = false;
  let muted = false;
  let gainMaster = null;
  let oscillators = [];
  let nextChordTime = 0;
  const btn = document.getElementById('music-btn');

  // Frutiger Aero color palette in notes:
  // Pentatonic-ish scale rooted in D, with 9ths and sus4 — bright, airy, optimistic
  const CHORDS = [
    [293.66, 369.99, 440.00, 587.33], // D maj9
    [329.63, 415.30, 493.88, 659.25], // E sus2
    [261.63, 329.63, 392.00, 523.25], // C maj
    [293.66, 349.23, 440.00, 587.33], // D sus4
    [220.00, 293.66, 369.99, 440.00], // A add9
    [261.63, 311.13, 392.00, 523.25], // C maj7(no3)
  ];

  // Gentle arp melody notes (high, bell-like)
  const MELODY = [
    880, 987.77, 1046.50, 880, 783.99, 880, 987.77, 1174.66,
    1046.50, 880, 987.77, 880, 783.99, 698.46, 783.99, 880,
  ];
  let melIdx = 0;

  function createCtx() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    gainMaster = ctx.createGain();
    gainMaster.gain.value = 0.0;
    gainMaster.connect(ctx.destination);
  }

  function softSine(freq, gainVal, startTime, duration, type = 'sine') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = type;
    osc.frequency.value = freq;

    filter.type = 'lowpass';
    filter.frequency.value = freq * 4;
    filter.Q.value = 0.5;

    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(gainVal, startTime + 0.12);
    g.gain.setValueAtTime(gainVal, startTime + duration - 0.3);
    g.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.connect(filter);
    filter.connect(g);
    g.connect(gainMaster);

    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
    return osc;
  }

  function bellNote(freq, startTime) {
    // Bell = sine + higher partial
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const g = ctx.createGain();
    const rev = ctx.createConvolver();

    // Simple reverb impulse
    const bufLen = ctx.sampleRate * 1.2;
    const impulse = ctx.createBuffer(2, bufLen, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < bufLen; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2.5);
      }
    }
    rev.buffer = impulse;

    osc1.type = 'sine';
    osc1.frequency.value = freq;
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2.756; // inharmonic partial = bell character

    const g2 = ctx.createGain();
    g2.gain.value = 0.25;

    g.gain.setValueAtTime(0.0, startTime);
    g.gain.linearRampToValueAtTime(0.06, startTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, startTime + 1.4);

    osc1.connect(g);
    osc2.connect(g2);
    g2.connect(g);
    g.connect(rev);
    rev.connect(gainMaster);
    g.connect(gainMaster);

    osc1.start(startTime); osc1.stop(startTime + 1.5);
    osc2.start(startTime); osc2.stop(startTime + 1.5);
  }

  let chordIdx = 0;
  let scheduleId = null;

  function schedule() {
    if (!running || !ctx) return;
    const now = ctx.currentTime;

    // Lookahead window
    while (nextChordTime < now + 0.4) {
      const chord = CHORDS[chordIdx % CHORDS.length];
      const t = nextChordTime;
      const dur = 3.6;

      // Pad: soft chords
      chord.forEach((freq, i) => {
        softSine(freq * 0.5, 0.022, t + i * 0.04, dur, 'sine');      // root oct down
        softSine(freq, 0.018, t + i * 0.04, dur, 'sine');             // natural
        softSine(freq * 2, 0.009, t + i * 0.06, dur * 0.85, 'sine'); // upper oct
      });

      // Arp bells every other chord
      if (chordIdx % 2 === 0) {
        for (let b = 0; b < 4; b++) {
          const mFreq = MELODY[melIdx % MELODY.length];
          bellNote(mFreq, t + b * 0.85);
          melIdx++;
        }
      }

      // Sub bass (very subtle)
      softSine(chord[0] * 0.25, 0.03, t, dur * 1.1, 'sine');

      chordIdx++;
      nextChordTime += dur;
    }
    scheduleId = setTimeout(schedule, 150);
  }

  function start() {
    if (running) return;
    createCtx();
    if (ctx.state === 'suspended') ctx.resume();
    running = true;
    nextChordTime = ctx.currentTime + 0.1;
    chordIdx = 0; melIdx = 0;
    gainMaster.gain.cancelScheduledValues(ctx.currentTime);
    gainMaster.gain.setValueAtTime(gainMaster.gain.value, ctx.currentTime);
    gainMaster.gain.linearRampToValueAtTime(0.72, ctx.currentTime + 2.5);
    schedule();
  }

  function stop() {
    running = false;
    clearTimeout(scheduleId);
    if (!ctx) return;
    gainMaster.gain.cancelScheduledValues(ctx.currentTime);
    gainMaster.gain.setValueAtTime(gainMaster.gain.value, ctx.currentTime);
    gainMaster.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 1.5);
  }

  // Auto-start on first user interaction (browser autoplay policy)
  let started = false;
  function tryAutoStart() {
    if (started) return;
    started = true;
    start();
    document.removeEventListener('pointerdown', tryAutoStart);
    document.removeEventListener('keydown', tryAutoStart);
  }
  document.addEventListener('pointerdown', tryAutoStart, { once: true });
  document.addEventListener('keydown', tryAutoStart, { once: true });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!started) { started = true; }
    muted = !muted;
    btn.classList.toggle('muted', muted);
    btn.textContent = muted ? '♩' : '♪';
    if (muted) stop(); else start();
  });
})();

/* ── XMB icon tap feedback (subtle scale pulse) ─────────────────────────── */
document.querySelectorAll('.xmb-item').forEach(item => {
  item.addEventListener('pointerdown', () => {
    item.style.transform = 'scale(0.88)';
  });
  item.addEventListener('pointerup', () => {
    item.style.transform = '';
  });
  item.addEventListener('pointerleave', () => {
    item.style.transform = '';
  });
});
</script>
</body>
