<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NULLPAD</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0a0f;
    --surface: #12121a;
    --border:  #1e1e2e;
    --accent:  #7c3aed;
    --accent2: #a855f7;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --radius:  16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .tagline {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 40px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.1s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  .card:active {
    transform: scale(0.96);
    border-color: var(--accent);
  }

  .card-icon {
    font-size: 36px;
    line-height: 1;
  }

  .card-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .card-sub {
    font-size: 11px;
    color: var(--muted);
  }

  .status-bar {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
</style>
</head>
<body>

<div class="logo">NULLPAD</div>
<div class="tagline">Mobile Controller Platform</div>

<div class="grid">
  <a class="card" href="/wiimote.html">
    <div class="card-icon">🕹️</div>
    <div class="card-name">Wiimote</div>
    <div class="card-sub">IR Pointer · Nunchuk</div>
  </a>

  <a class="card" href="/dualsense.html">
    <div class="card-icon">🎮</div>
    <div class="card-name">DualSense</div>
    <div class="card-sub">PS5 Layout</div>
  </a>

  <a class="card" href="/xbox.html">
    <div class="card-icon">🟢</div>
    <div class="card-name">Xbox</div>
    <div class="card-sub">XInput Standard</div>
  </a>

  <a class="card" href="/joycon.html">
    <div class="card-icon">🔵</div>
    <div class="card-name">Joy-Con</div>
    <div class="card-sub">Single · Pair</div>
  </a>
</div>

<div class="status-bar">
  <div class="dot"></div>
  <span id="status">Ready — select a controller</span>
</div>

</body>
</html>
